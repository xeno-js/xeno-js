name: anduril

services:
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    container_name: anduril-app-dev
    working_dir: /workspace
    environment:
      APP_DEV_PORT: ${APP_DEV_PORT:-5173}
      CHOKIDAR_USEPOLLING: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-anduril}
    ports:
      - "${APP_DEV_PORT:-5173}:5173"
    volumes:
      - ./:/workspace
      - anduril_root_node_modules:/workspace/node_modules
      - anduril_app_node_modules:/workspace/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: anduril-app
    ports:
      - "${APP_PROD_PORT:-8080}:80"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: anduril-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anduril}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - anduril_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-anduril}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  anduril_postgres_data:
  anduril_root_node_modules:
  anduril_app_node_modules:
